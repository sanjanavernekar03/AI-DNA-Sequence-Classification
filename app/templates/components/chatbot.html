<!-- GLOBAL AI CHATBOT & VOICE ASSISTANT COMPONENT -->
<div class="chatbot-wrapper" id="global-chatbot-wrapper">
<style>
    /* Robot Launcher Animation & Styling */
    .chatbot-launcher-container {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 1050;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .chatbot-greeting-bubble {
        background: var(--bg-card);
        color: var(--text-main, #172033);
        padding: 8px 14px;
        border-radius: 20px;
        border-bottom-right-radius: 4px;
        font-size: 0.85rem;
        font-weight: 500;
        box-shadow: 0 4px 12px rgba(23, 105, 170, 0.15);
        border: 1px solid var(--border-color, #D9E1EA);
        opacity: 0;
        transform: translateX(10px);
        transition: opacity 0.3s ease, transform 0.3s ease;
        pointer-events: none;
        white-space: nowrap;
    }

    .chatbot-launcher-container:hover .chatbot-greeting-bubble {
        opacity: 1;
        transform: translateX(0);
    }

    /* Override existing styles for the button */
    #chatbot-toggle-btn.robot-launcher-btn {
        background: transparent !important;
        border: none !important;
        padding: 0 !important;
        cursor: pointer;
        outline: none;
        position: relative !important;
        bottom: auto !important;
        right: auto !important;
        width: 65px !important;
        height: 65px !important;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 0 !important;
        animation: floatRobot 3.5s ease-in-out infinite;
        transition: transform 0.3s ease, filter 0.3s ease;
        box-shadow: none !important;
    }

    #chatbot-toggle-btn.robot-launcher-btn:hover {
        transform: scale(1.1) translateY(-2px);
        filter: drop-shadow(0 8px 16px rgba(15, 139, 141, 0.4));
    }

    @keyframes floatRobot {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
    }

    .robot-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    .robot-eye {
        animation: blinkRobot 4s infinite;
        transform-origin: center;
    }

    @keyframes blinkRobot {
        0%, 46%, 48%, 50%, 100% { transform: scaleY(1); }
        47%, 49% { transform: scaleY(0.1); }
    }

    .robot-antenna {
        animation: wiggleAntenna 3s ease-in-out infinite;
        transform-origin: bottom center;
    }

    @keyframes wiggleAntenna {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(6deg); }
    }

    /* Hide on mobile if space is tight */
    @media (max-width: 768px) {
        .chatbot-launcher-container {
            bottom: 20px;
            right: 20px;
        }
        #chatbot-toggle-btn.robot-launcher-btn {
            width: 55px !important;
            height: 55px !important;
        }
        .chatbot-greeting-bubble {
            display: none;
        }
    }
    </style>
<!-- Floating Chatbot Button -->
<div class="chatbot-launcher-container">
<div class="chatbot-greeting-bubble" data-i18n="auto_a72ed0">
                Hi! I'm here to help. <span style="font-size: 1.1em;">👋</span>
</div>
<button class="robot-launcher-btn" id="chatbot-toggle-btn" title="AI Health Assistant">
<!-- Modern Friendly Robot SVG -->
<svg class="robot-svg" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<!-- Antenna -->
<g class="robot-antenna">
<line stroke="#A0AEC0" stroke-linecap="round" stroke-width="3.5" x1="50" x2="50" y1="28" y2="14"></line>
<circle cx="50" cy="11" fill="#6B46C1" r="4.5"></circle>
</g>
<!-- Head -->
<rect fill="#FFFFFF" height="46" rx="18" stroke="#E2E8F0" stroke-width="2.5" width="56" x="22" y="28"></rect>
<!-- Face Screen -->
<rect fill="#1E293B" height="22" rx="8" width="40" x="30" y="37"></rect>
<!-- Eyes (Glowing Teal) -->
<circle class="robot-eye" cx="41" cy="48" fill="#0D9488" r="4.5" style="filter: drop-shadow(0 0 4px #0D9488);"></circle>
<circle class="robot-eye" cx="59" cy="48" fill="#0D9488" r="4.5" style="filter: drop-shadow(0 0 4px #0D9488);"></circle>
<!-- Ear / Side nodes -->
<rect fill="#CBD5E1" height="14" rx="2" width="5" x="17" y="45"></rect>
<rect fill="#CBD5E1" height="14" rx="2" width="5" x="78" y="45"></rect>
<!-- Neck -->
<rect fill="#94A3B8" height="7" width="16" x="42" y="74"></rect>
<!-- Body/Base (floating) -->
<path d="M 28 80 Q 50 76 72 80 L 78 92 Q 50 100 22 92 Z" fill="#6B46C1" stroke="#4C1D95" stroke-width="1.5"></path>
<!-- Base light -->
<circle cx="50" cy="88" fill="#F3E8FF" opacity="0.9" r="3.5"></circle>
<!-- Little arms -->
<path d="M 28 82 Q 16 88 22 95" fill="none" stroke="#CBD5E1" stroke-linecap="round" stroke-width="3.5"></path>
<path d="M 72 82 Q 84 88 78 95" fill="none" stroke="#CBD5E1" stroke-linecap="round" stroke-width="3.5"></path>
</svg>
</button>
</div>
<!-- Chatbot Panel -->
<div class="chatbot-panel shadow-sm d-none" id="chatbot-panel" style="background: var(--bg-card, #FFFFFF); border: 1px solid var(--border-color, #E2E8F0); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;">
<!-- Panel Header -->
<div class="chatbot-header d-flex align-items-center justify-content-between px-3 py-3 text-white" style="background: var(--primary, #6B46C1);">
<div class="d-flex align-items-center gap-2">
<div class="chatbot-avatar-icon d-flex align-items-center justify-content-center rounded-circle" style="background-color: var(--bg-surface); width: 32px; height: 32px; color: var(--primary, #1769AA);">
<i class="bi bi-robot"></i>
</div>
<div>
<h6 class="mb-0 fw-bold fs-6" data-i18n="bot_header_title">AI Health Assistant</h6>
<small style="font-size: 0.72rem; color: #E3F2FD;"><i class="bi bi-circle-fill me-1" style="font-size: 0.5rem; color: #4CAF50;"></i><span data-i18n="bot_status_online">Online</span></small>
</div>
</div>
<div class="d-flex align-items-center gap-2">
<select class="form-select form-select-sm global-lang-select" id="chatbot-lang-select" style="background-color: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); color: white;">

<option class="text-dark" value="en">English</option>
<option class="text-dark" value="hi">हिन्दी</option>
<option class="text-dark" value="kn">ಕನ್ನಡ</option>
<option class="text-dark" value="ta">தமிழ்</option>

</select>
<button class="btn btn-sm text-white p-0 fs-5" id="chatbot-close-btn">
<i class="bi bi-x-lg"></i>
</button>
</div>
</div>
<!-- Conversation Area -->
<div class="chatbot-conversation p-3" id="chatbot-conversation" style="flex-grow: 1; overflow-y: auto; background: var(--bg-main, #F6F8FB);">
<div class="chat-message assistant-msg mb-3">
<div class="msg-bubble p-3 rounded-3 shadow-sm" style="background: var(--bg-surface-elevated); border: 1px solid var(--border-color, #D9E1EA); border-bottom-left-radius: 0;">
<div class="fw-semibold mb-1 small" data-i18n="auto_54a385" style="color: var(--primary, #1769AA);"><i class="bi bi-robot me-1"></i>DNAura Assistant</div>
<div data-i18n="auto_153334" style="color: var(--text-main, #172033); font-size: 0.9rem;">Hello! How can I assist you with your health or genetic analysis today?</div>
<div class="disclaimer-chip mt-2 p-2 rounded" style="background: #FFF3E0; color: #E65100; font-size: 0.75rem;">
<i class="bi bi-shield-exclamation me-1"></i>
<span data-i18n="chat_disclaimer">Educational purposes only. Not medical advice.</span>
</div>
<div class="chatbot-suggestions mt-3 d-flex flex-wrap gap-2">
<button class="btn btn-sm btn-outline-primary chat-suggestion" data-chat-prompt="What is DNA?" data-i18n="gen_what_is_dna_9eba" style="border-radius: 20px; font-size: 0.8rem;" type="button">What is DNA?</button>
<button class="btn btn-sm btn-outline-primary chat-suggestion" data-chat-prompt="Explain mutations" data-i18n="gen_explain_mutations_d248" style="border-radius: 20px; font-size: 0.8rem;" type="button">Explain mutations</button>
<button class="btn btn-sm btn-outline-primary chat-suggestion" data-chat-prompt="Find nearby hospitals" data-i18n="gen_find_hospitals_33f6" style="border-radius: 20px; font-size: 0.8rem;" type="button">Find hospitals</button>
</div>
</div>
</div>
</div>
<!-- Voice & Input Toolbar -->
<div class="chatbot-footer border-top p-2" style="background: var(--bg-card, #FFFFFF);">
<div class="d-flex align-items-center gap-2 mb-2 px-1">
<button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1 py-1 px-2" id="btn-voice-input" style="font-size: 0.8rem;">
<i class="bi bi-mic-fill"></i> <span data-i18n="bot_voice_btn" id="voice-input-label">Voice Input</span>
</button>
<button class="btn btn-sm btn-outline-primary d-flex align-items-center gap-1 py-1 px-2 active" id="btn-voice-output-toggle" style="font-size: 0.8rem;">
<i class="bi bi-volume-up-fill"></i> <span data-i18n="chat_listen_btn" id="voice-output-label">Listen</span>
</button>
<span class="small text-muted ms-auto" id="voice-status-text" style="font-size: 0.75rem;"></span>
</div>
<form class="d-flex align-items-center gap-2 px-1" id="chatbot-form" onsubmit="return false;">
<input autocomplete="off" class="form-control" data-i18n-placeholder="bot_input_ph" id="chatbot-input" placeholder="Type a message..." style="border-radius: 20px; border-color: var(--border-color, #D9E1EA);" type="text"/>
<button class="btn text-white rounded-circle d-flex align-items-center justify-content-center" id="chatbot-send-btn" style="background: var(--primary, #1769AA); width: 38px; height: 38px; padding: 0;" type="submit">
<i class="bi bi-send-fill" style="margin-left: -2px;"></i>
</button>
</form>
</div>
</div>
</div>
